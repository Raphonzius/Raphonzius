<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200" role="img" aria-label="GitHub stats">
<defs>
  <linearGradient id="stats-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b1a"/><stop offset=".55" stop-color="#0f1a33"/><stop offset="1" stop-color="#0a1226"/>
  </linearGradient>
  <radialGradient id="stats-o1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".45"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
  <radialGradient id="stats-o2"><stop offset="0" stop-color="#a78bfa" stop-opacity=".40"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <radialGradient id="stats-o3"><stop offset="0" stop-color="#f59e0b" stop-opacity=".22"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
  <linearGradient id="stats-edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2dd4bf" stop-opacity=".9"/><stop offset=".5" stop-color="#a78bfa" stop-opacity=".5"/><stop offset="1" stop-color="#f59e0b" stop-opacity=".8"/>
  </linearGradient>
  <clipPath id="stats-clip"><rect width="860" height="200" rx="18"/></clipPath>
</defs>
<style>
  #stats text { font-family: 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif; }
  #stats .mono { font-family: 'JetBrains Mono','Cascadia Code',Consolas,'Liberation Mono',monospace; }
  #stats .o1 { animation: stats-fa 10s ease-in-out infinite; }
  #stats .o2 { animation: stats-fb 13s ease-in-out infinite; }
  #stats .o3 { animation: stats-fa 16s ease-in-out infinite reverse; }
  #stats .in { animation: stats-in .7s ease-out both; }
  #stats .cur { animation: stats-blink 1.1s step-end infinite; }
  @keyframes stats-fa { 0%,100% { transform: translate(0,0); } 50% { transform: translate(34px,-18px); } }
  @keyframes stats-fb { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-30px,16px); } }
  @keyframes stats-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes stats-blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  
  @media (prefers-reduced-motion: reduce) { #stats * { animation: none !important; } }
</style>
<g id="stats" clip-path="url(#stats-clip)">
  <rect width="860" height="200" fill="url(#stats-bg)"/>
  <ellipse class="o1" cx="120" cy="30" rx="260" ry="120" fill="url(#stats-o1)"/>
  <ellipse class="o2" cx="740" cy="180" rx="300" ry="130" fill="url(#stats-o2)"/>
  <ellipse class="o3" cx="520" cy="10" rx="220" ry="90" fill="url(#stats-o3)"/>
  <rect x="14" y="14" width="832" height="172" rx="14" fill="#0b1224" fill-opacity=".55" stroke="#24324f"/>
  <rect x="14" y="14" width="832" height="2" fill="url(#stats-edge)"/>
<text x="40" y="50" fill="#2dd4bf" font-size="11" font-weight="700" letter-spacing="3" class="mono">PROFILE SIGNAL</text><text x="820" y="50" fill="#8b9bb4" font-size="11" text-anchor="end" class="mono">updated 2026-11-09</text>
  <g class="in" style="animation-delay:0.15s"><rect x="32" y="76" width="190" height="94" rx="12" fill="#0f1a33" fill-opacity=".75" stroke="#24324f"/><rect x="32" y="76" width="4" height="94" rx="2" fill="#2dd4bf"/><text x="52" y="102" fill="#8b9bb4" font-size="11" letter-spacing="1.5" class="mono">CONTRIBUTIONS</text><text x="52" y="140" fill="#e6edf3" font-size="32" font-weight="800">213</text><text x="52" y="160" fill="#8b9bb4" font-size="11">last 12 months</text></g><g class="in" style="animation-delay:0.27s"><rect x="234" y="76" width="190" height="94" rx="12" fill="#0f1a33" fill-opacity=".75" stroke="#24324f"/><rect x="234" y="76" width="4" height="94" rx="2" fill="#f59e0b"/><text x="254" y="102" fill="#8b9bb4" font-size="11" letter-spacing="1.5" class="mono">COMMITS</text><text x="254" y="140" fill="#e6edf3" font-size="32" font-weight="800">201</text><text x="254" y="160" fill="#8b9bb4" font-size="11">public + private</text></g><g class="in" style="animation-delay:0.39s"><rect x="436" y="76" width="190" height="94" rx="12" fill="#0f1a33" fill-opacity=".75" stroke="#24324f"/><rect x="436" y="76" width="4" height="94" rx="2" fill="#a78bfa"/><text x="456" y="102" fill="#8b9bb4" font-size="11" letter-spacing="1.5" class="mono">ACTIVE DAYS</text><text x="456" y="140" fill="#e6edf3" font-size="32" font-weight="800">38</text><text x="456" y="160" fill="#8b9bb4" font-size="11">busiest: 31</text></g><g class="in" style="animation-delay:0.51s"><rect x="638" y="76" width="190" height="94" rx="12" fill="#0f1a33" fill-opacity=".75" stroke="#24324f"/><rect x="638" y="76" width="4" height="94" rx="2" fill="#38bdf8"/><text x="658" y="102" fill="#8b9bb4" font-size="11" letter-spacing="1.5" class="mono">PUBLIC REPOS</text><text x="658" y="140" fill="#e6edf3" font-size="32" font-weight="800">11</text><text x="658" y="160" fill="#8b9bb4" font-size="11">2 followers</text></g>
</g>
</svg>

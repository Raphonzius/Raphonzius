<svg xmlns="http://www.w3.org/2000/svg" width="420" height="86" viewBox="0 0 420 86" role="img" aria-label="Full paper, Latinoware 2026: tcc-modern-lvc-arch.github.io"><title>Full paper, Latinoware 2026: tcc-modern-lvc-arch.github.io</title><defs><linearGradient id="osLnkPaperP" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#f6f1e6"/><stop offset="1" stop-color="#ebe2cd"/></linearGradient><linearGradient id="osLnkPaperF" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0" stop-color="#e4cf98"/><stop offset="1" stop-color="#d2ba7c"/></linearGradient><filter id="osLnkPaperG" x="0" y="0" width="1" height="1"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="11" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .36  0 0 0 0 .30  0 0 0 0 .22  0 0 0 .16 0"/><feComposite in2="SourceAlpha" operator="in"/></filter><filter id="osLnkPaperS" x="-10%" y="-10%" width="120%" height="130%"><feGaussianBlur in="SourceAlpha" stdDeviation="7"/><feOffset dy="7"/><feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer></filter></defs><style>@font-face{font-family:'Plex';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Plex';font-weight:600;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}
#osLnkPaper text{font-family:'Plex',monospace;fill:#1b1a17}
#osLnkPaper .b{font-weight:600} #osLnkPaper .mu{fill:#57503f} #osLnkPaper .rd{fill:#b3261e} #osLnkPaper .pp{fill:#f6f1e6}
#osLnkPaper .sf{font-family:'Serif',serif;letter-spacing:-0.02em} #osLnkPaper .it{font-style:italic}
#osLnkPaper .cap{letter-spacing:.07em}
#osLnkPaper .w,#osLnkPaper .f,#osLnkPaper .up,#osLnkPaper .st{animation-fill-mode:both;animation-timing-function:cubic-bezier(0.23, 1, 0.32, 1)}
#osLnkPaper .w{animation-name:osLnkPaperwipe;animation-duration:380ms}
#osLnkPaper .f{animation-name:osLnkPaperrise;animation-duration:400ms}
#osLnkPaper .up{animation-name:osLnkPaperup;animation-duration:560ms}
#osLnkPaper .st{animation-name:osLnkPaperstamp;animation-duration:200ms;transform-box:fill-box;transform-origin:center}
#osLnkPaper .cur{animation:osLnkPaperblink 1.1s steps(1) infinite}
@keyframes osLnkPaperwipe{from{clip-path:inset(-8px 100% -8px -8px)}to{clip-path:inset(-8px -8px -8px -8px)}}
@keyframes osLnkPaperrise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes osLnkPaperup{from{transform:translateY(32px)}to{transform:none}}
@keyframes osLnkPaperstamp{from{opacity:0;transform:scale(1.15)}to{opacity:1;transform:none}}
@keyframes osLnkPaperblink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
@keyframes osLnkPaperfade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  #osLnkPaper .w,#osLnkPaper .f,#osLnkPaper .up,#osLnkPaper .st{animation:osLnkPaperfade 300ms cubic-bezier(0.23, 1, 0.32, 1) both !important;animation-delay:0ms !important}
  #osLnkPaper .cur,#osLnkPaper .loop{animation:none !important;opacity:1}
  #osLnkPaper .dev{animation:none !important;opacity:0}
}
#osLnkPaper .f{animation-duration:240ms}</style><g id="osLnkPaper"><rect width="420" height="86" rx="10" fill="#1f1d19"/><rect x="10" y="10" width="400" height="60" rx="3" fill="#000" filter="url(#osLnkPaperS)"/><rect x="10" y="10" width="400" height="60" rx="3" fill="url(#osLnkPaperP)"/><rect x="10" y="10" width="400" height="60" rx="3" fill="#fff" filter="url(#osLnkPaperG)"/><line x1="114" y1="16" x2="114" y2="64" stroke="#57503f" stroke-width="1.4" stroke-dasharray="1 5" stroke-linecap="round"/><circle cx="114" cy="10" r="6" fill="#1f1d19"/><circle cx="114" cy="70" r="6" fill="#1f1d19"/><g class="f" style="animation-delay:0ms" ><text x="62.0" y="45.0" font-size="14" class="b rd cap" text-anchor="middle" >PAPER</text><text x="134" y="35" font-size="13" class="mu" >Full paper, Latinoware 2026</text><text x="134" y="58" font-size="14" class="b" >tcc-modern-lvc-arch.github.io</text></g></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="860" height="434" viewBox="0 0 860 434" role="img" aria-label="Featured projects">
<defs>
  <linearGradient id="projects-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b1a"/><stop offset=".55" stop-color="#0f1a33"/><stop offset="1" stop-color="#0a1226"/>
  </linearGradient>
  <radialGradient id="projects-o1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".45"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
  <radialGradient id="projects-o2"><stop offset="0" stop-color="#a78bfa" stop-opacity=".40"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <radialGradient id="projects-o3"><stop offset="0" stop-color="#f59e0b" stop-opacity=".22"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
  <linearGradient id="projects-edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2dd4bf" stop-opacity=".9"/><stop offset=".5" stop-color="#a78bfa" stop-opacity=".5"/><stop offset="1" stop-color="#f59e0b" stop-opacity=".8"/>
  </linearGradient>
  <clipPath id="projects-clip"><rect width="860" height="434" rx="18"/></clipPath>
</defs>
<style>
  #projects text { font-family: 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif; }
  #projects .mono { font-family: 'JetBrains Mono','Cascadia Code',Consolas,'Liberation Mono',monospace; }
  #projects .o1 { animation: projects-fa 10s ease-in-out infinite; }
  #projects .o2 { animation: projects-fb 13s ease-in-out infinite; }
  #projects .o3 { animation: projects-fa 16s ease-in-out infinite reverse; }
  #projects .in { animation: projects-in .7s ease-out both; }
  #projects .cur { animation: projects-blink 1.1s step-end infinite; }
  @keyframes projects-fa { 0%,100% { transform: translate(0,0); } 50% { transform: translate(34px,-18px); } }
  @keyframes projects-fb { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-30px,16px); } }
  @keyframes projects-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes projects-blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  
  @media (prefers-reduced-motion: reduce) { #projects * { animation: none !important; } }
</style>
<g id="projects" clip-path="url(#projects-clip)">
  <rect width="860" height="434" fill="url(#projects-bg)"/>
  <ellipse class="o1" cx="120" cy="30" rx="260" ry="120" fill="url(#projects-o1)"/>
  <ellipse class="o2" cx="740" cy="414" rx="300" ry="130" fill="url(#projects-o2)"/>

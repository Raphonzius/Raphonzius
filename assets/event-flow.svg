<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-label="Event-driven flow: outbox, broker, idempotent consumers, DLQ with retry">
<defs>
  <linearGradient id="flow-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b1a"/><stop offset=".55" stop-color="#0f1a33"/><stop offset="1" stop-color="#0a1226"/>
  </linearGradient>
  <radialGradient id="flow-o1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".45"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
  <radialGradient id="flow-o2"><stop offset="0" stop-color="#a78bfa" stop-opacity=".40"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <radialGradient id="flow-o3"><stop offset="0" stop-color="#f59e0b" stop-opacity=".22"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
  <linearGradient id="flow-edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2dd4bf" stop-opacity=".9"/><stop offset=".5" stop-color="#a78bfa" stop-opacity=".5"/><stop offset="1" stop-color="#f59e0b" stop-opacity=".8"/>
  </linearGradient>
  <clipPath id="flow-clip"><rect width="860" height="300" rx="18"/></clipPath>
</defs>
<style>
  #flow text { font-family: 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif; }
  #flow .mono { font-family: 'JetBrains Mono','Cascadia Code',Consolas,'Liberation Mono',monospace; }
  #flow .o1 { animation: flow-fa 10s ease-in-out infinite; }
  #flow .o2 { animation: flow-fb 13s ease-in-out infinite; }
  #flow .o3 { animation: flow-fa 16s ease-in-out infinite reverse; }
  #flow .in { animation: flow-in .7s ease-out both; }
  #flow .cur { animation: flow-blink 1.1s step-end infinite; }
  @keyframes flow-fa { 0%,100% { transform: translate(0,0); } 50% { transform: translate(34px,-18px); } }
  @keyframes flow-fb { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-30px,16px); } }
  @keyframes flow-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes flow-blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  
  @media (prefers-reduced-motion: reduce) { #flow * { animation: none !important; } }
</style>
<g id="flow" clip-path="url(#flow-clip)">
  <rect width="860" height="300" fill="url(#flow-bg)"/>
  <ellipse class="o1" cx="120" cy="30" rx="260" ry="120" fill="url(#flow-o1)"/>
  <ellipse class="o2" cx="740" cy="280" rx="300" ry="130" fill="url(#flow-o2)"/>
  <ellipse class="o3" cx="520" cy="10" rx="220" ry="90" fill="url(#flow-o3)"/>
  <rect x="14" y="14" width="832" height="272" rx="14" fill="#0b1224" fill-opacity=".55" stroke="#24324f"/>
  <rect x="14" y="14" width="832" height="2" fill="url(#flow-edge)"/>
<text x="40" y="50" fill="#2dd4bf" font-size="11" font-weight="700" letter-spacing="3" class="mono">EVENT FLOW</text><text x="820" y="50" fill="#8b9bb4" font-size="11" text-anchor="end" class="mono">outbox → broker → idempotent consumers</text>
  <text x="40" y="80" fill="#e6edf3" font-size="20" font-weight="800">Messages that never get lost or processed twice</text>
  <path d="M150 147 L190 147" fill="none" stroke="#24324f" stroke-width="2"/><path d="M300 147 L340 147" fill="none" stroke="#24324f" stroke-width="2"/><path d="M470 140 C500 140 500 97 530 97" fill="none" stroke="#24324f" stroke-width="2"/><path d="M470 154 C500 154 500 197 530 197" fill="none" stroke="#24324f" stroke-width="2"/><path d="M670 197 C700 197 690 147 720 147" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="5 5"/><path d="M770 174 C770 260 405 260 405 174" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="5 5"/><g class="in" style="animation-delay:0.00s"><rect x="40" y="120" width="110" height="54" rx="10" fill="#0f1a33" stroke="#f59e0b" stroke-opacity=".8"/><text x="95.0" y="144" fill="#e6edf3" font-size="14" font-weight="700" text-anchor="middle">Pix API</text><text x="95.0" y="162" fill="#8b9bb4" font-size="11" text-anchor="middle" class="mono">Open Finance</text></g><g class="in" style="animation-delay:0.15s"><rect x="190" y="120" width="110" height="54" rx="10" fill="#0f1a33" stroke="#2dd4bf" stroke-opacity=".8"/><text x="245.0" y="144" fill="#e6edf3" font-size="14" font-weight="700" text-anchor="middle">Outbox</text><text x="245.0" y="162" fill="#8b9bb4" font-size="11" text-anchor="middle" class="mono">same TX</text></g><g class="in" style="animation-delay:0.30s"><rect x="340" y="120" width="130" height="54" rx="10" fill="#0f1a33" stroke="#38bdf8" stroke-opacity=".8"/><text x="405.0" y="144" fill="#e6edf3" font-size="14" font-weight="700" text-anchor="middle">Broker</text><text x="405.0" y="162" fill="#8b9bb4" font-size="11" text-anchor="middle" class="mono">RabbitMQ · ASB</text></g><g class="in" style="animation-delay:0.45s"><rect x="530" y="70" width="140" height="54" rx="10" fill="#0f1a33" stroke="#2dd4bf" stroke-opacity=".8"/><text x="600.0" y="94" fill="#e6edf3" font-size="14" font-weight="700" text-anchor="middle">Consumer A</text><text x="600.0" y="112" fill="#8b9bb4" font-size="11" text-anchor="middle" class="mono">idempotent</text></g><g class="in" style="animation-delay:0.60s"><rect x="530" y="170" width="140" height="54" rx="10" fill="#0f1a33" stroke="#2dd4bf" stroke-opacity=".8"/><text x="600.0" y="194" fill="#e6edf3" font-size="14" font-weight="700" text-anchor="middle">Consumer B</text><text x="600.0" y="212" fill="#8b9bb4" font-size="11" text-anchor="middle" class="mono">idempotent</text></g><g class="in" style="animation-delay:0.75s"><rect x="720" y="120" width="100" height="54" rx="10" fill="#0f1a33" stroke="#fb7185" stroke-opacity=".8"/><text x="770.0" y="144" fill="#e6edf3" font-size="14" font-weight="700" text-anchor="middle">DLQ</text><text x="770.0" y="162" fill="#8b9bb4" font-size="11" text-anchor="middle" class="mono">retry</text></g><circle r="5" fill="#2dd4bf" opacity="0"><animate attributeName="opacity" values="1;0" keyTimes="0;0.330" calcMode="discrete" dur="10.0s" begin="0.0s" repeatCount="indefinite"/><animateMotion path="M150 147 L190 147 M300 147 L340 147 M470 140 C500 140 500 97 530 97" keyPoints="0;1;1" keyTimes="0;0.330;1" calcMode="linear" dur="10.0s" begin="0.0s" repeatCount="indefinite"/></circle><circle r="5" fill="#f59e0b" opacity="0"><animate attributeName="opacity" values="1;0" keyTimes="0;0.330" calcMode="discrete" dur="10.0s" begin="1.6s" repeatCount="indefinite"/><animateMotion path="M150 147 L190 147 M300 147 L340 147 M470 154 C500 154 500 197 530 197" keyPoints="0;1;1" keyTimes="0;0.330;1" calcMode="linear" dur="10.0s" begin="1.6s" repeatCount="indefinite"/></circle><circle r="5" fill="#fb7185" opacity="0"><animate attributeName="opacity" values="1;0" keyTimes="0;0.550" calcMode="discrete" dur="10.0s" begin="3.2s" repeatCount="indefinite"/><animateMotion path="M150 147 L190 147 M300 147 L340 147 M470 154 C500 154 500 197 530 197 M670 197 C700 197 690 147 720 147 M770 174 C770 260 405 260 405 174" keyPoints="0;1;1" keyTimes="0;0.550;1" calcMode="linear" dur="10.0s" begin="3.2s" repeatCount="indefinite"/></circle><circle r="5" fill="#38bdf8" opacity="0"><animate attributeName="opacity" values="1;0" keyTimes="0;0.330" calcMode="discrete" dur="10.0s" begin="6.4s" repeatCount="indefinite"/><animateMotion path="M150 147 L190 147 M300 147 L340 147 M470 140 C500 140 500 97 530 97" keyPoints="0;1;1" keyTimes="0;0.330;1" calcMode="linear" dur="10.0s" begin="6.4s" repeatCount="indefinite"/></circle>
  <text x="588" y="262" fill="#fb7185" font-size="11" class="mono">poison message → DLQ → retry</text>
  <text x="40" y="270" fill="#8b9bb4" font-size="11" class="mono">pub/sub · Azure Service Bus · Event Hubs · P95/P99 latency budgets</text>

</g>
</svg>

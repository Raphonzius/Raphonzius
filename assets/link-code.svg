<svg xmlns="http://www.w3.org/2000/svg" width="420" height="86" viewBox="0 0 420 86" role="img" aria-label="Source code, 6 modules: github.com/tcc-modern-lvc-arch"><title>Source code, 6 modules: github.com/tcc-modern-lvc-arch</title><defs><linearGradient id="osLnkCodeP" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#f6f1e6"/><stop offset="1" stop-color="#ebe2cd"/></linearGradient><linearGradient id="osLnkCodeF" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0" stop-color="#e4cf98"/><stop offset="1" stop-color="#d2ba7c"/></linearGradient><filter id="osLnkCodeG" x="0" y="0" width="1" height="1"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="11" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .36  0 0 0 0 .30  0 0 0 0 .22  0 0 0 .16 0"/><feComposite in2="SourceAlpha" operator="in"/></filter><filter id="osLnkCodeS" x="-10%" y="-10%" width="120%" height="130%"><feGaussianBlur in="SourceAlpha" stdDeviation="7"/><feOffset dy="7"/><feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer></filter></defs><style>@font-face{font-family:'Plex';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Plex';font-weight:600;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}
#osLnkCode text{font-family:'Plex',monospace;fill:#1b1a17}
#osLnkCode .b{font-weight:600} #osLnkCode .mu{fill:#57503f} #osLnkCode .rd{fill:#b3261e} #osLnkCode .pp{fill:#f6f1e6}
#osLnkCode .sf{font-family:'Serif',serif;letter-spacing:-0.02em} #osLnkCode .it{font-style:italic}
#osLnkCode .cap{letter-spacing:.07em}
#osLnkCode .w,#osLnkCode .f,#osLnkCode .up,#osLnkCode .st{animation-fill-mode:both;animation-timing-function:cubic-bezier(0.23, 1, 0.32, 1)}
#osLnkCode .w{animation-name:osLnkCodewipe;animation-duration:380ms}
#osLnkCode .f{animation-name:osLnkCoderise;animation-duration:400ms}
#osLnkCode .up{animation-name:osLnkCodeup;animation-duration:560ms}
#osLnkCode .st{animation-name:osLnkCodestamp;animation-duration:200ms;transform-box:fill-box;transform-origin:center}
#osLnkCode .cur{animation:osLnkCodeblink 1.1s steps(1) infinite}
@keyframes osLnkCodewipe{from{clip-path:inset(-8px 100% -8px -8px)}to{clip-path:inset(-8px -8px -8px -8px)}}
@keyframes osLnkCoderise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes osLnkCodeup{from{transform:translateY(32px)}to{transform:none}}
@keyframes osLnkCodestamp{from{opacity:0;transform:scale(1.15)}to{opacity:1;transform:none}}
@keyframes osLnkCodeblink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
@keyframes osLnkCodefade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  #osLnkCode .w,#osLnkCode .f,#osLnkCode .up,#osLnkCode .st{animation:osLnkCodefade 300ms cubic-bezier(0.23, 1, 0.32, 1) both !important;animation-delay:0ms !important}
  #osLnkCode .cur,#osLnkCode .loop{animation:none !important;opacity:1}
  #osLnkCode .dev{animation:none !important;opacity:0}
}

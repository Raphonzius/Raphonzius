<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-label="Token budget: cache, scripts, vector search and routing before the model">
<defs>
  <linearGradient id="tokens-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b1a"/><stop offset=".55" stop-color="#0f1a33"/><stop offset="1" stop-color="#0a1226"/>
  </linearGradient>
  <radialGradient id="tokens-o1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".45"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
  <radialGradient id="tokens-o2"><stop offset="0" stop-color="#a78bfa" stop-opacity=".40"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <radialGradient id="tokens-o3"><stop offset="0" stop-color="#f59e0b" stop-opacity=".22"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
  <linearGradient id="tokens-edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2dd4bf" stop-opacity=".9"/><stop offset=".5" stop-color="#a78bfa" stop-opacity=".5"/><stop offset="1" stop-color="#f59e0b" stop-opacity=".8"/>
  </linearGradient>
  <clipPath id="tokens-clip"><rect width="860" height="330" rx="18"/></clipPath>
</defs>
<style>
  #tokens text { font-family: 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif; }
  #tokens .mono { font-family: 'JetBrains Mono','Cascadia Code',Consolas,'Liberation Mono',monospace; }
  #tokens .o1 { animation: tokens-fa 10s ease-in-out infinite; }
  #tokens .o2 { animation: tokens-fb 13s ease-in-out infinite; }
  #tokens .o3 { animation: tokens-fa 16s ease-in-out infinite reverse; }
  #tokens .in { animation: tokens-in .7s ease-out both; }
  #tokens .cur { animation: tokens-blink 1.1s step-end infinite; }
  @keyframes tokens-fa { 0%,100% { transform: translate(0,0); } 50% { transform: translate(34px,-18px); } }
  @keyframes tokens-fb { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-30px,16px); } }
  @keyframes tokens-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes tokens-blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  #tokens .b0 { animation: tokens-grow 1.1s cubic-bezier(.2,.8,.2,1) both 0.30s; transform-box: fill-box; transform-origin: left; }
#tokens .b1 { animation: tokens-grow 1.1s cubic-bezier(.2,.8,.2,1) both 0.65s; transform-box: fill-box; transform-origin: left; }
#tokens .b2 { animation: tokens-grow 1.1s cubic-bezier(.2,.8,.2,1) both 1.00s; transform-box: fill-box; transform-origin: left; }
#tokens .b3 { animation: tokens-grow 1.1s cubic-bezier(.2,.8,.2,1) both 1.35s; transform-box: fill-box; transform-origin: left; }
#tokens .b4 { animation: tokens-grow 1.1s cubic-bezier(.2,.8,.2,1) both 1.70s; transform-box: fill-box; transform-origin: left; }
@keyframes tokens-grow { from { transform: scaleX(0); opacity:.2 } 40% { opacity:1 } to { transform: scaleX(1); opacity:1 } }
#tokens .scan { animation: tokens-scan 4.5s ease-in-out infinite; }@keyframes tokens-scan { 0% { transform: translateX(0) } 50% { transform: translateX(424px) } 100% { transform: translateX(0) } }
  @media (prefers-reduced-motion: reduce) { #tokens * { animation: none !important; } }
</style>
<g id="tokens" clip-path="url(#tokens-clip)">
  <rect width="860" height="330" fill="url(#tokens-bg)"/>
  <ellipse class="o1" cx="120" cy="30" rx="260" ry="120" fill="url(#tokens-o1)"/>
  <ellipse class="o2" cx="740" cy="310" rx="300" ry="130" fill="url(#tokens-o2)"/>
  <ellipse class="o3" cx="520" cy="10" rx="220" ry="90" fill="url(#tokens-o3)"/>
  <rect x="14" y="14" width="832" height="302" rx="14" fill="#0b1224" fill-opacity=".55" stroke="#24324f"/>
  <rect x="14" y="14" width="832" height="2" fill="url(#tokens-edge)"/>
<text x="40" y="50" fill="#2dd4bf" font-size="11" font-weight="700" letter-spacing="3" class="mono">TOKEN BUDGET</text><text x="820" y="50" fill="#8b9bb4" font-size="11" text-anchor="end" class="mono">deterministic first, inference last</text>
  <text x="40" y="80" fill="#e6edf3" font-size="20" font-weight="800">If it can be deterministic, it should not be inference</text>
  <g class="in" style="animation-delay:0.20s"><text x="40" y="121" fill="#e6edf3" font-size="14" font-weight="700">Raw request</text><text x="40" y="136" fill="#8b9bb4" font-size="10.5">everything the agent could read</text></g><rect x="330" y="108" width="430" height="20" rx="10" fill="#24324f" fill-opacity=".45"/><rect class="b0" x="330" y="108" width="430" height="20" rx="10" fill="#fb7185" fill-opacity=".85"/><g class="in" style="animation-delay:0.55s"><text x="40" y="161" fill="#e6edf3" font-size="14" font-weight="700">CAG cache</text><text x="40" y="176" fill="#8b9bb4" font-size="10.5">repeated context served from cache</text></g><rect x="330" y="148" width="430" height="20" rx="10" fill="#24324f" fill-opacity=".45"/><rect class="b1" x="330" y="148" width="318" height="20" rx="10" fill="#f59e0b" fill-opacity=".85"/><g class="in" style="animation-delay:0.90s"><text x="40" y="201" fill="#e6edf3" font-size="14" font-weight="700">Scripts</text><text x="40" y="216" fill="#8b9bb4" font-size="10.5">fixed queries replace model-written ones</text></g><rect x="330" y="188" width="430" height="20" rx="10" fill="#24324f" fill-opacity=".45"/><rect class="b2" x="330" y="188" width="223" height="20" rx="10" fill="#38bdf8" fill-opacity=".85"/><g class="in" style="animation-delay:1.25s"><text x="40" y="241" fill="#e6edf3" font-size="14" font-weight="700">Qdrant</text><text x="40" y="256" fill="#8b9bb4" font-size="10.5">vector search keeps only what matters</text></g><rect x="330" y="228" width="430" height="20" rx="10" fill="#24324f" fill-opacity=".45"/><rect class="b3" x="330" y="228" width="141" height="20" rx="10" fill="#2dd4bf" fill-opacity=".85"/><g class="in" style="animation-delay:1.60s"><text x="40" y="281" fill="#e6edf3" font-size="14" font-weight="700">Jev / Laya</text><text x="40" y="296" fill="#8b9bb4" font-size="10.5">route simple subtasks to the cheap model</text></g><rect x="330" y="268" width="430" height="20" rx="10" fill="#24324f" fill-opacity=".45"/><rect class="b4" x="330" y="268" width="86" height="20" rx="10" fill="#a78bfa" fill-opacity=".85"/>
  <rect class="scan" x="330" y="104" width="3" height="190" rx="1.5" fill="#2dd4bf" fill-opacity=".55"/>
  <text x="820" y="304" fill="#8b9bb4" font-size="10" text-anchor="end" class="mono">bar widths are illustrative</text>

</g>
</svg>

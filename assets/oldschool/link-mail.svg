<svg xmlns="http://www.w3.org/2000/svg" width="420" height="86" viewBox="0 0 420 86" role="img" aria-label="Email Rafael: rafael.informa@gmail.com"><title>Email Rafael: rafael.informa@gmail.com</title><defs><linearGradient id="osLnkMailP" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#f6f1e6"/><stop offset="1" stop-color="#ebe2cd"/></linearGradient><linearGradient id="osLnkMailF" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0" stop-color="#e4cf98"/><stop offset="1" stop-color="#d2ba7c"/></linearGradient><filter id="osLnkMailG" x="0" y="0" width="1" height="1"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="11" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .36  0 0 0 0 .30  0 0 0 0 .22  0 0 0 .16 0"/><feComposite in2="SourceAlpha" operator="in"/></filter><filter id="osLnkMailS" x="-10%" y="-10%" width="120%" height="130%"><feGaussianBlur in="SourceAlpha" stdDeviation="7"/><feOffset dy="7"/><feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer></filter></defs><style>@font-face{font-family:'Plex';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Plex';font-weight:600;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}
#osLnkMail text{font-family:'Plex',monospace;fill:#1b1a17}
#osLnkMail .b{font-weight:600} #osLnkMail .mu{fill:#57503f} #osLnkMail .rd{fill:#b3261e} #osLnkMail .pp{fill:#f6f1e6}
#osLnkMail .sf{font-family:'Serif',serif;letter-spacing:-0.02em} #osLnkMail .it{font-style:italic}
#osLnkMail .cap{letter-spacing:.07em}
#osLnkMail .w,#osLnkMail .f,#osLnkMail .up,#osLnkMail .st{animation-fill-mode:both;animation-timing-function:cubic-bezier(0.23, 1, 0.32, 1)}
#osLnkMail .w{animation-name:osLnkMailwipe;animation-duration:380ms}
#osLnkMail .f{animation-name:osLnkMailrise;animation-duration:400ms}
#osLnkMail .up{animation-name:osLnkMailup;animation-duration:560ms}
#osLnkMail .st{animation-name:osLnkMailstamp;animation-duration:200ms;transform-box:fill-box;transform-origin:center}
#osLnkMail .cur{animation:osLnkMailblink 1.1s steps(1) infinite}
@keyframes osLnkMailwipe{from{clip-path:inset(-8px 100% -8px -8px)}to{clip-path:inset(-8px -8px -8px -8px)}}
@keyframes osLnkMailrise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes osLnkMailup{from{transform:translateY(32px)}to{transform:none}}
@keyframes osLnkMailstamp{from{opacity:0;transform:scale(1.15)}to{opacity:1;transform:none}}
@keyframes osLnkMailblink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
@keyframes osLnkMailfade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  #osLnkMail .w,#osLnkMail .f,#osLnkMail .up,#osLnkMail .st{animation:osLnkMailfade 300ms cubic-bezier(0.23, 1, 0.32, 1) both !important;animation-delay:0ms !important}
  #osLnkMail .cur,#osLnkMail .loop{animation:none !important;opacity:1}
  #osLnkMail .dev{animation:none !important;opacity:0}
}

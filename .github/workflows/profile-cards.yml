name: Refresh profile cards

# Rebuilds the live SVG cards (stats, language stack, contribution stream)
# from the GitHub API and force-pushes them to the `output` branch.
# Keeping them off `main` means no daily noise commits in the history.
on:
  schedule:
    - cron: "17 6 * * *" # daily, 03:17 in Sao Paulo
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["gen/**", ".github/workflows/profile-cards.yml"]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build live cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python gen/build.py live dist

      - name: Publish to output branch
        working-directory: dist
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Refresh profile cards"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
